name: Generate Mystery Story and Voice

on:
  workflow_dispatch:

permissions:
  contents: write # history.json लाई सेभ गर्नको लागि

jobs:
  run-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tools
        run: |
          pip install google-genai edge-tts

      - name: Run Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      - name: Save Story and Audio
        uses: actions/upload-artifact@v4
        with:
          name: mystery-full-package
          path: |
            full_story_voice.mp3
            story_details.txt

      - name: Commit Updated History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -m "Update history [skip ci]" || echo "No changes to commit"
          git push
