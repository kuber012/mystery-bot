name: Generate Mystery Short Video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-short:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Fonts
        run: |
          sudo apt update
          sudo apt install -y ffmpeg fonts-freefont-ttf fonts-dejavu-core
          pip install google-genai edge-tts requests

      - name: Run Master Video Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      - name: Upload Final Video
        uses: actions/upload-artifact@v4
        with:
          name: final-mystery-short-video
          path: final_mystery_short.mp4

      - name: Commit Updated History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -m "Update history [skip ci]" || echo "No changes to commit"
          git push
