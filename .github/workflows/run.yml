name: Generate Mystery Voice and Script

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-voice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tools
        run: |
          pip install google-genai edge-tts

      - name: Run Mystery Voice Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      - name: Save Voice and Script
        uses: actions/upload-artifact@v4
        with:
          name: mystery-audio-package
          path: |
            mystery_voice.mp3
            script_and_guide.txt

      - name: Commit Updated History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -m "Update history [skip ci]" || echo "No changes"
          git push
